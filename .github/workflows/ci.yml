name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # btrix declares darwin and linux, and the differences bite in practice:
    # shasum vs sha256sum in the vendor script, and /var -> /private/var
    # symlinks in the path tests. Running one platform would hide both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # engines says >=22.19. Testing the floor as well as current would be
          # better; this at least is not "whatever the runner had today".
          #
          # @types/node is held at ^22 to match, which is why `npm outdated`
          # reports it as behind -- that is deliberate, not neglect. Typing
          # against a newer Node than the floor lets a call that does not exist
          # on 22.19 typecheck here and throw for whoever installed on the
          # oldest supported Node, and this job would not catch it: it runs
          # 22.19 but would be checking against the newer types.
          node-version: 22.19
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run check

      # No container engine. Nothing here needs one -- the tests that touch the
      # engine only assert "nothing is running" -- but ubuntu runners ship
      # docker and podman, and a loaded one answers `docker ps` in seconds
      # rather than milliseconds. That was enough to time out three tests at
      # vitest's 5s default, intermittently. macOS runners have no engine at
      # all, which is why that job was always the green one.
      - name: tests
        run: npm test
        env:
          BTRIX_ENGINE: none

      # The digests in vendor/replaywebpage/provenance.json are only worth
      # anything if something re-hashes them. Nothing did until this ran: the
      # vendor script writes the manifest from the files it just copied, so it
      # agrees with itself by construction.
      - name: vendored bundle matches its recorded digests
        run: ./scripts/vendor-replay.sh --verify

  # 0.1.0 shipped an install that could not start: bin/btrix.js imported .ts
  # files, and node refuses to strip types under node_modules. Every test
  # passed, because `npm link` resolves the symlink to a path outside
  # node_modules where stripping is allowed. Only a real install shows it.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19
          cache: npm
      - run: npm ci

      - name: pack, install elsewhere, and run it
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          work="$(mktemp -d)"
          cp "$tarball" "$work/"
          cd "$work"
          npm init -y >/dev/null
          npm install "./$tarball"
          # Away from the checkout, with the files genuinely under
          # node_modules, and an agent dir it cannot disturb.
          cd "$(mktemp -d)"
          BTRIX_AGENT_DIR="$(mktemp -d)" "$work/node_modules/.bin/btrix" --version

      - name: the viewer is in the tarball, or replay silently goes remote
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          # Listed once into a variable rather than piped into `grep -q`:
          # grep exits on the first match, GNU tar then fails writing to a
          # closed pipe, and pipefail turns that into a failed step.
          listing="$(tar tzf "$tarball")"
          for f in \
            package/vendor/replaywebpage/ui.js \
            package/vendor/replaywebpage/replay/sw.js \
            package/vendor/replaywebpage/LICENSE
          do
            echo "$listing" | grep -qx "$f" || { echo "missing from tarball: $f" >&2; exit 1; }
          done
